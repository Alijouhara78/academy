<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>school-app</title>
    </head>
  <body>
    <div id="splash-screen" class="splash-screen">
      <div class="spinner"></div>
      <h2 class="splash-text">جاري التحميل...</h2>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      // ننتظر حتى يتم تحميل كامل الصفحة (الصور، الملفات، إلخ)
      window.addEventListener('load', () => {
        const splashScreen = document.getElementById('splash-screen');
        
        // نضيف تأخير بسيط (اختياري) لضمان رؤية الحركة الجمالية
        setTimeout(() => {
          splashScreen.classList.add('fade-out');
          
          // إزالة العنصر تماماً من الـ DOM بعد انتهاء حركة الاختفاء لتخفيف الذاكرة
          setTimeout(() => {
            splashScreen.style.display = 'none';
          }, 500); // 500 ملي ثانية هي نفس مدة الـ transition في الـ CSS
        }, 800); 
      });
    </script>
  </body>
</html>
